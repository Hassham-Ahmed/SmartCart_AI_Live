<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | SmartCart AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <!-- Page Header Banner -->
    <div class="bg-dark text-white py-4 mb-4 shadow-sm border-bottom border-secondary">
        <div class="container text-center text-md-start">
            <h2 class="fw-bold mb-1">🛍️ Explore Our Products</h2>
            <p class="text-secondary mb-0 small">Discover high-quality items with AI-powered recommendations.</p>
        </div>
    </div>

    <div class="container">
        <!-- Search & Filter Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-5">
            <!-- Search Bar -->
            <div class="row g-2 mb-4">
                <div class="col-md-9">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control form-control-lg border-start-0 ps-0" placeholder="Search products, brands or items..." onkeypress="handleSearch(event)">
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" onclick="searchProducts()">
                        🔍 Search
                    </button>
                </div>
            </div>

            <hr class="text-muted my-3">

            <!-- Filter Controls -->
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Category</label>
                    <select id="categoryFilter" class="form-select border-1">
                        <option value="" selected>All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Laptops">Laptops</option>
                        <option value="Mobiles">Mobiles</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home & Kitchen">Home & Kitchen</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Brand</label>
                    <select id="brandFilter" class="form-select border-1">
                        <option value="" selected>All Brands</option>
                        <option value="Apple">Apple</option>
                        <option value="Samsung">Samsung</option>
                        <option value="Dell">Dell</option>
                        <option value="HP">HP</option>
                        <option value="Lenovo">Lenovo</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Price Range</label>
                    <select id="priceFilter" class="form-select border-1">
                        <option value="" selected>Price Range</option>
                        <option value="0-50000">Under Rs. 50,000</option>
                        <option value="50000-100000">Rs. 50,000 - 100,000</option>
                        <option value="100000-200000">Rs. 100,000 - 200,000</option>
                        <option value="200000-above">Above Rs. 200,000</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-outline-primary w-100 fw-bold py-2" onclick="applyFilters()">
                        <i class="bi bi-funnel me-1"></i> Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Products Container -->
        <div class="row g-4" id="productsContainer">
            <!-- Dynamic Product Cards Injected Here -->
        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-container" class="mt-5"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/product.js"></script>
    <script src="js/script.js"></script>
    <script src="main.js"></script>
</body>
</html>
