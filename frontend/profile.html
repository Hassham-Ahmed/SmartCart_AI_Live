<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SmartCart AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <div class="container my-5">
        <div class="row g-4">

            <!-- Left User Summary Sidebar -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 text-center p-4 bg-white">
                    <div class="position-relative d-inline-block mx-auto mb-3">
                        <img id="profile-image" src="https://via.placeholder.com/150" class="rounded-circle img-thumbnail border-2 border-primary shadow-sm" style="width: 130px; height: 130px; object-fit: cover;">
                    </div>

                    <h4 id="profile-name" class="fw-bold text-dark mb-1">Loading...</h4>
                    <p class="text-muted small mb-3" id="profile-email">loading@example.com</p>

                    <div class="d-grid gap-2">
                        <a href="wishlist.html" class="btn btn-outline-primary btn-md fw-medium">
                            ❤️ Wishlist
                        </a>
                        <a href="order-history.html" class="btn btn-outline-success btn-md fw-medium">
                            📦 My Orders
                        </a>
                    </div>
                </div>
            </div>

            <!-- Right Forms Section -->
            <div class="col-lg-8">

                <!-- Personal Info Card -->
                <div class="card shadow-sm border-0 rounded-4 p-4 mb-4 bg-white">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-person-gear me-2"></i>Personal Information</h4>
                    <hr class="text-muted mb-4">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Full Name</label>
                            <input type="text" id="full-name" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Email Address</label>
                            <input type="email" id="email" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Phone Number</label>
                            <input type="text" id="phone" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">City</label>
                            <input type="text" id="city" class="form-control">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium text-secondary">Shipping Address</label>
                            <textarea id="address" class="form-control" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <button class="btn btn-success fw-bold px-4 py-2" onclick="updateProfile()">
                            💾 Save Changes
                        </button>
                    </div>
                </div>

                <!-- Password Change Card -->
                <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                    <h5 class="fw-bold text-danger mb-3"><i class="bi bi-shield-lock me-2"></i>Change Password</h5>
                    <hr class="text-muted mb-4">

                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-medium text-secondary">Current Password</label>
                            <input type="password" id="current-password" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">New Password</label>
                            <input type="password" id="new-password" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Confirm New Password</label>
                            <input type="password" id="confirm-password" class="form-control">
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <button class="btn btn-danger fw-bold px-4 py-2" onclick="changePassword()">
                            🔑 Update Password
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/profile.js"></script>
    <script src="main.js"></script>
</body>
</html>
