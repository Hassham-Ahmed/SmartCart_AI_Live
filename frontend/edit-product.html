<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | SmartCart AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="admin.html">
            👨‍💼 SmartCart AI Admin
        </a>

        <a href="admin.html" class="btn btn-outline-light">
            ⬅ Dashboard
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="mb-0">
                        ✏ Edit Product
                    </h3>

                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label>Product Name</label>
                        <input id="name" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Brand</label>
                        <input id="brand" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Category</label>
                        <input id="category" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Price</label>
                        <input id="price" type="number" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Stock</label>
                        <input id="stock" type="number" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Image URL</label>
                        <input id="image" class="form-control">
                    </div>

                    <div class="mb-4">
                        <label>Description</label>
                        <textarea id="description"
                                  rows="4"
                                  class="form-control"></textarea>
                    </div>

                    <button
                        class="btn btn-warning w-100 btn-lg"
                        onclick="updateProduct()">

                        💾 Update Product

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/edit-product.js"></script>

</body>
</html>
