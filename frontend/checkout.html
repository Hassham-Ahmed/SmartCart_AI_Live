<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-5">
        <div class="row g-4">
            <!-- Form Section -->
            <div class="col-lg-8">
                <div class="card shadow-sm p-4">
                    <h3 class="fw-bold mb-4">🚚 Shipping Information</h3>
                    <form onsubmit="return false;">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Full Name</label>
                                <input type="text" class="form-control" placeholder="Full Name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Email</label>
                                <input type="email" class="form-control" placeholder="email@example.com">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-medium">Phone</label>
                                <input type="text" class="form-control" placeholder="+92 300 0000000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-medium">Province</label>
                                <select class="form-select">
                                    <option selected>Select Province</option>
                                    <option>Sindh</option>
                                    <option>Punjab</option>
                                    <option>KPK</option>
                                    <option>Balochistan</option>
                                    <option>Islamabad</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-medium">City</label>
                                <input type="text" class="form-control" placeholder="Karachi">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-medium">Complete Delivery Address</label>
                                <textarea id="address" class="form-control" rows="3" placeholder="House #, Street, Block, Area..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Order Summary Section -->
            <div class="col-lg-4">
                <div class="card shadow-sm p-4">
                    <h4 class="fw-bold mb-3">Order Summary</h4>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Items Total:</span>
                        <strong>Rs. 185,000</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-success">
                        <span>Shipping:</span>
                        <strong>Free</strong>
                    </div>

                    <!-- Coupon -->
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Coupon Code">
                        <button class="btn btn-outline-primary">Apply</button>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <h5 class="fw-bold">Total Amount:</h5>
                        <h5 class="fw-bold text-primary">Rs. 185,000</h5>
                    </div>

                    <h6 class="fw-bold mt-4 mb-2">Payment Method</h6>
                    <div class="d-flex flex-column gap-2 mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="cod" checked>
                            <label class="form-check-label" for="cod">Cash on Delivery</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="card">
                            <label class="form-check-label" for="card">Credit / Debit Card</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="easypaisa">
                            <label class="form-check-label" for="easypaisa">Easypaisa / JazzCash</label>
                        </div>
                    </div>

                    <button class="btn btn-success btn-lg w-100 fw-bold" onclick="placeOrder()">Place Order Now</button>
                    <small class="text-muted text-center d-block mt-3">🔒 256-bit SSL Encrypted Payment</small>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="js/script.js"></script>
    <script src="js/checkout.js"></script>
    <script src="main.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
