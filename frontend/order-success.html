<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed | SmartCart AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <!-- Order Confirmation Card -->
    <div class="container my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <div class="mb-3 text-success">
                        <i class="bi bi-check-circle-fill display-1"></i>
                    </div>

                    <h2 class="fw-bold text-success mb-2">Order Placed Successfully!</h2>
                    <p class="text-muted mb-4">Thank you for shopping with SmartCart AI. Your order has been received and is currently being processed.</p>

                    <div class="bg-light p-3 rounded-3 mb-4">
                        <p class="mb-1 text-muted small">Order Identifier</p>
                        <h4 class="fw-bold text-primary mb-2">#SC100245</h4>
                        <hr class="my-2 opacity-25">
                        <p class="mb-0 text-secondary small">
                            🚚 Estimated Delivery: <strong class="text-dark">2 - 4 Business Days</strong>
                        </p>
                    </div>

                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="products.html" class="btn btn-primary btn-lg fw-bold px-4 shadow-sm">
                            <i class="bi bi-bag me-1"></i> Continue Shopping
                        </a>
                        <a href="order-history.html" class="btn btn-outline-success btn-lg fw-bold px-4">
                            📦 My Orders
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="main.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
