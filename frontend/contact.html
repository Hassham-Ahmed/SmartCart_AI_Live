<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-5">
        <div class="text-center mb-5 page-header">
            <h1 class="fw-bold">Contact Us</h1>
            <p class="text-muted">Have a question or feedback? We'd love to hear from you.</p>
        </div>

        <div class="row g-4">
            <!-- Form Card -->
            <div class="col-lg-7">
                <div class="card shadow-sm p-4 h-100">
                    <h3 class="fw-bold mb-4">Send Us a Message</h3>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Full Name</label>
                        <input type="text" id="full-name" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Subject</label>
                        <input type="text" id="subject" class="form-control" placeholder="Order inquiry / Feedback">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Message</label>
                        <textarea id="message" class="form-control" rows="4" placeholder="Type your message here..."></textarea>
                    </div>
                    <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="sendMessage()">Send Message</button>
                </div>
            </div>

            <!-- Contact Info Sidebar -->
            <div class="col-lg-5">
                <div class="card shadow-sm p-4 h-100 bg-white">
                    <h3 class="fw-bold mb-3">Get in Touch</h3>
                    <hr>
                    <div class="d-flex flex-column gap-3 fs-6">
                        <div>📧 <strong>Email:</strong> support@smartcartai.com</div>
                        <div>📞 <strong>Phone:</strong> +92-300-1234567</div>
                        <div>📍 <strong>Location:</strong> Karachi, Pakistan</div>
                        <div>🕒 <strong>Working Days:</strong> Mon - Sat (9:00 AM - 6:00 PM)</div>
                    </div>
                    <hr class="my-4">
                    <h5 class="fw-bold mb-3">Follow SmartCart AI</h5>
                    <div class="d-flex gap-3 text-secondary">
                        <span>📘 Facebook</span>
                        <span>📷 Instagram</span>
                        <span>💼 LinkedIn</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="js/script.js"></script>
    <script src="js/contact.js"></script>
    <script src="main.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
