<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-5">
        <h2 class="fw-bold mb-4">🛒 Your Shopping Cart</h2>

        <div class="card shadow-sm border-0 mb-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Product</th>
                            <th>Image</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems">
                        <!-- Dynamic Cart Items via cart.js -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Checkout Bar -->
        <div class="card shadow-sm p-4 d-flex flex-row justify-content-between align-items-center bg-white">
            <div>
                <span class="text-muted">Subtotal:</span>
                <h3 class="fw-bold mb-0 text-primary">Rs. <span id="cartTotal">0</span></h3>
            </div>
            <a href="checkout.html" class="btn btn-success btn-lg px-4 fw-bold">Proceed to Checkout →</a>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
    <script src="main.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
