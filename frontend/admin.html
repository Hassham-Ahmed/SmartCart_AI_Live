<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart AI - Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-5">
        👨‍💼 SmartCart AI Admin Dashboard
    </h2>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h1 id="total-users">0</h1>

                    <h5>Total Users</h5>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h1 id="total-products">0</h1>

                    <h5>Total Products</h5>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h1 id="total-orders">0</h1>

                    <h5>Total Orders</h5>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center">

                <div class="card-body">

                    <h1 id="total-revenue">0</h1>

                    <h5>Total Revenue</h5>

                </div>

            </div>

        </div>

    </div>

</div>
<hr class="my-5">

<div class="d-flex justify-content-between align-items-center mb-4">

    <h3>📦 Product Management</h3>

    <button
        class="btn btn-success"
        onclick="window.location.href='add-product.html'">

        ➕ Add Product

    </button>
       <a href="admin-orders.html"
          class="btn btn-primary btn-lg">

            📦 Manage Orders

        </a>
        <a href="user-management.html"
            class="btn btn-dark btn-lg">

                👥 Manage Users

        </a>

</div>

<div class="table-responsive">

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Product</th>

                <th>Category</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Edit</th>

                <th>Delete</th>

            </tr>

        </thead>

        <tbody id="products-table">

        </tbody>

    </table>

</div>

<script src="js/admin.js"></script>

</body>

</html>
