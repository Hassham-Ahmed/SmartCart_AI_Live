<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCart AI - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin-style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="admin.html">
                <i class="fa-solid fa-shield-halved text-primary"></i>
                <span>SmartCart AI <span class="badge bg-primary fs-6 fw-normal ms-1">Admin</span></span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-light btn-custom btn-sm">
                    <i class="fa-solid fa-store me-1"></i> View Store
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <!-- Header Title -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h3 class="fw-bold mb-1">Dashboard Overview</h3>
                <p class="text-muted mb-0">Welcome back! Here is what's happening with your store today.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a href="add-product.html" class="btn btn-primary btn-custom">
                    <i class="fa-solid fa-plus me-2"></i>Add Product
                </a>
                <a href="admin-orders.html" class="btn btn-outline-secondary btn-custom">
                    <i class="fa-solid fa-box me-2"></i>Orders
                </a>
                <a href="user-management.html" class="btn btn-outline-secondary btn-custom">
                    <i class="fa-solid fa-users me-2"></i>Users
                </a>
                <a href="contact-messages.html" class="btn btn-outline-secondary btn-custom">
                    <i class="fa-solid fa-envelope me-2"></i>Messages
                </a>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="row g-4 mb-5">
            <div class="col-xl-3 col-md-6">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <p class="text-muted small fw-semibold text-uppercase mb-1">Total Users</p>
                            <h2 class="fw-bold mb-0" id="total-users">0</h2>
                        </div>
                        <div class="icon-shape bg-primary bg-opacity-10 text-primary">
                            <i class="fa-solid fa-users"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <p class="text-muted small fw-semibold text-uppercase mb-1">Total Products</p>
                            <h2 class="fw-bold mb-0" id="total-products">0</h2>
                        </div>
                        <div class="icon-shape bg-success bg-opacity-10 text-success">
                            <i class="fa-solid fa-boxes-stacked"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <p class="text-muted small fw-semibold text-uppercase mb-1">Total Orders</p>
                            <h2 class="fw-bold mb-0" id="total-orders">0</h2>
                        </div>
                        <div class="icon-shape bg-warning bg-opacity-10 text-warning">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6">
                <div class="card stat-card p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <p class="text-muted small fw-semibold text-uppercase mb-1">Total Revenue</p>
                            <h2 class="fw-bold mb-0" id="total-revenue">0</h2>
                        </div>
                        <div class="icon-shape bg-info bg-opacity-10 text-info">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product Management Table -->
        <div class="card card-custom overflow-hidden">
            <div class="card-header bg-white py-3 px-4 d-flex justify-content-between align-items-center border-bottom">
                <h5 class="fw-bold mb-0">📦 Product Inventory</h5>
                <button class="btn btn-sm btn-light border btn-custom" onclick="loadProducts()">
                    <i class="fa-solid fa-rotate me-1"></i> Refresh
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock Status</th>
                            <th class="text-center">Edit</th>
                            <th class="text-center">Delete</th>
                        </tr>
                    </thead>
                    <tbody id="products-table">
                        <!-- Products will be loaded here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/admin.js"></script>
</body>

</html>
