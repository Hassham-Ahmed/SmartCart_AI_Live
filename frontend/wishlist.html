<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | SmartCart AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <!-- Header Banner -->
    <div class="bg-dark text-white py-4 mb-5 shadow-sm border-bottom border-secondary">
        <div class="container">
            <h2 class="fw-bold mb-1">❤️ My Wishlist</h2>
            <p class="text-secondary mb-0 small">Saved items you want to buy later.</p>
        </div>
    </div>

    <!-- Wishlist Products Grid -->
    <div class="container min-vh-50 mb-5">
        <div class="row g-4" id="wishlistContainer">
            <!-- Wishlist Items Injected Here via wishlist.js -->
        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/script.js"></script>
    <script src="main.js"></script>
</body>
</html>
