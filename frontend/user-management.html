<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | SmartCart AI Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin-style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4" href="admin.html">
                <i class="fa-solid fa-shield-halved text-primary me-2"></i>SmartCart AI Admin
            </a>
            <a href="admin.html" class="btn btn-outline-light btn-custom btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h3 class="fw-bold mb-1">👥 User Accounts</h3>
                <p class="text-muted mb-0">Manage registered customer accounts and profiles.</p>
            </div>
            <button class="btn btn-light border btn-custom" onclick="location.reload()">
                <i class="fa-solid fa-rotate me-1"></i> Refresh
            </button>
        </div>

        <div class="card card-custom overflow-hidden">
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Phone Number</th>
                            <th>City</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/user-management.js"></script>
</body>

</html>
