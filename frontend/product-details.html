<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | SmartCart AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Product View Section -->
    <div class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="row g-4 align-items-center">

                <!-- Product Image Column -->
                <div class="col-lg-5 text-center">
                    <div class="position-relative overflow-hidden rounded-4 shadow-sm border">
                        <img id="product-image" 
                             src="https://picsum.photos/450/450?random=1" 
                             class="img-fluid w-100" 
                             style="max-height: 420px; object-fit: cover;" 
                             alt="Product Image">
                    </div>
                </div>

                <!-- Product Details Column -->
                <div class="col-lg-7">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span id="product-stock" class="badge bg-success px-3 py-2 rounded-pill">In Stock</span>
                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">
                            ⭐ <span id="average-rating">0</span> Rating
                        </span>
                    </div>

                    <h2 id="product-name" class="fw-bold text-dark mb-2">Loading Product...</h2>
                    
                    <p class="text-muted small mb-3">
                        <i class="bi bi-tag-fill me-1 text-primary"></i> 
                        Category: <strong id="product-category" class="text-dark">--</strong>
                    </p>

                    <h3 id="product-price" class="fw-bold text-primary display-6 mb-4">PKR 0</h3>

                    <hr class="text-muted opacity-25">

                    <h6 class="fw-bold text-secondary">Description</h6>
                    <p id="product-description" class="text-secondary lh-base mb-4">
                        Loading description...
                    </p>

                    <!-- Quantity Controls -->
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small">Select Quantity</label>
                        <div class="input-group" style="max-width: 160px;">
                            <button class="btn btn-outline-secondary fw-bold" type="button" onclick="decreaseQty()">-</button>
                            <input type="number" id="quantity" class="form-control text-center fw-bold bg-light" value="1" min="1">
                            <button class="btn btn-outline-secondary fw-bold" type="button" onclick="increaseQty()">+</button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex flex-wrap gap-2 pt-2">
                        <button onclick="addToCartDetails()" class="btn btn-primary btn-lg fw-bold px-4 shadow-sm">
                            <i class="bi bi-cart-plus me-1"></i> Add to Cart
                        </button>

                        <button onclick="buyNowDetails()" class="btn btn-success btn-lg fw-bold px-4 shadow-sm">
                            <i class="bi bi-lightning-charge me-1"></i> Buy Now
                        </button>

                        <button onclick="addToWishlistDetails()" class="btn btn-outline-danger btn-lg fw-bold px-3">
                            ❤️ Wishlist
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- AI Assistant Prompt Section -->
    <div class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-dark text-white">
            <div class="d-flex align-items-center gap-2 mb-3">
                <span class="fs-4">🤖</span>
                <h4 class="fw-bold mb-0">Ask SmartCart AI About This Product</h4>
            </div>
            <p class="text-secondary small mb-3">Get instant answers about specifications, compatibility, and real user opinions.</p>
            <div class="input-group input-group-lg">
                <input type="text" class="form-control border-0" placeholder="e.g. Is this compatible with Mac? How is the battery life?">
                <button class="btn btn-primary fw-bold px-4" type="button">Ask AI</button>
            </div>
        </div>
    </div>

    <!-- Reviews Section -->
    <div class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                <h3 class="fw-bold text-dark mb-0"><i class="bi bi-star-fill text-warning me-2"></i>Product Reviews</h3>
                <span class="fs-5 fw-bold text-muted">
                    <span id="reviews-avg-rating" class="text-dark">0</span> ⭐ 
                    (<span id="total-reviews">0</span> Reviews)
                </span>
            </div>

            <!-- Write Review Card -->
            <div class="card border-0 bg-light p-4 rounded-4 mb-4">
                <h5 class="fw-bold text-dark mb-3">✍️ Write a Review</h5>

                <div class="mb-3">
                    <label class="form-label fw-medium text-secondary">Your Rating</label>
                    <select id="rating" class="form-select border-0 shadow-sm">
                        <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                        <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                        <option value="3">⭐⭐⭐ (3 - Average)</option>
                        <option value="2">⭐⭐ (2 - Poor)</option>
                        <option value="1">⭐ (1 - Terrible)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium text-secondary">Review Comments</label>
                    <textarea id="review" class="form-control border-0 shadow-sm" rows="3" placeholder="Share your experience with this product..."></textarea>
                </div>

                <div class="text-end">
                    <button class="btn btn-primary fw-bold px-4" onclick="submitReview()">
                        Submit Review
                    </button>
                </div>
            </div>

            <!-- Reviews Dynamic List -->
            <div id="reviewsContainer"></div>
        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/product-details.js"></script>
</body>
</html>
