<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartCart AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <!-- Registration Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary mb-1">🚀 Create Your Account</h3>
                        <p class="text-muted small">Join SmartCart AI for personalized shopping</p>
                    </div>

                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-medium text-secondary">Full Name</label>
                            <input type="text" id="full_name" class="form-control form-control-lg fs-6" placeholder="e.g. Hassham Ahmed" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium text-secondary">Email Address</label>
                                <input type="email" id="email" class="form-control form-control-lg fs-6" placeholder="name@example.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium text-secondary">Phone Number</label>
                                <input type="text" id="phone" class="form-control form-control-lg fs-6" placeholder="0300-1234567">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium text-secondary">Password</label>
                                <input type="password" id="password" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium text-secondary">Confirm Password</label>
                                <input type="password" id="confirm_password" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium text-secondary">City</label>
                            <input type="text" id="city" class="form-control form-control-lg fs-6" placeholder="Enter your city">
                        </div>

                        <button type="button" id="registerBtn" class="btn btn-primary w-100 btn-lg fw-bold shadow-sm py-2">
                            Create Account
                        </button>
                    </form>

                    <hr class="text-muted my-4">

                    <p class="text-center text-muted small mb-0">
                        Already have an account? 
                        <a href="login.html" class="text-primary fw-bold text-decoration-none ms-1">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/register.js"></script>
    <script src="js/script.js"></script>
    <script src="main.js"></script>
</body>
</html>
