<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | SmartCart AI Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin-style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom py-3">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4" href="admin.html">
                <i class="fa-solid fa-shield-halved text-primary me-2"></i>SmartCart AI Admin
            </a>
            <a href="admin.html" class="btn btn-outline-light btn-custom btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom p-4">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="icon-shape bg-primary bg-opacity-10 text-primary">
                            <i class="fa-solid fa-plus fs-4"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Add New Product</h4>
                            <p class="text-muted small mb-0">Fill in the details below to add a product to the store inventory.</p>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Product Name</label>
                            <input type="text" id="name" class="form-control form-control-lg fs-6" placeholder="e.g. Wireless Noise Cancelling Headphones">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Brand</label>
                            <input type="text" id="brand" class="form-control" placeholder="e.g. Sony">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Category</label>
                            <input type="text" id="category" class="form-control" placeholder="e.g. Electronics">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Price (PKR)</label>
                            <input type="number" id="price" class="form-control" placeholder="0.00">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Stock Quantity</label>
                            <input type="number" id="stock" class="form-control" placeholder="100">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Image URL</label>
                            <input type="text" id="image" class="form-control" placeholder="https://example.com/image.jpg">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea id="description" rows="4" class="form-control" placeholder="Enter detailed product description..."></textarea>
                        </div>

                        <div class="col-md-12 mt-4">
                            <button class="btn btn-primary btn-custom w-100 py-3 fw-bold" onclick="addProduct()">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Save Product
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/add-product.js"></script>
</body>

</html>
